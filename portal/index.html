    <!-- גיליון הפונטים נטען בלי לחסום את הציור הראשון. שתי סיבות, ושתיהן
         נמדדו: Lighthouse זקף 530ms ל-render-blocking ו-290ms ל-font-display,
         ונטפרי חוסמת כאן את fonts.googleapis.com מדי פעם — ואז הבקשה החוסמת
         מעכבת את כל העמוד עד שהיא נכשלת. ‎media="print"‎ מוריד את הגיליון
         מנתיב הציור, ו-‎onload‎ מחזיר אותו ברגע שהגיע. גופן החלופה
         (‎system-ui‎) מוגדר ממילא לפי DESIGN_STANDARD §1, ולכן העמוד קריא
         מהרגע הראשון גם אם הפונטים לא יגיעו כלל. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Suez+One&family=Secular+One&family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>

        href="https://fonts.googleapis.com/css2?family=Suez+One&family=Secular+One&family=Frank+Ruhl+Libre:wght@300;400;500&family=Heebo:wght@300;400;500;700&display=swap"
