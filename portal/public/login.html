<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>כניסה · מור מערכות תוכנה</title>
    <meta name="description" content="כניסה אחת לכל מערכות מור מערכות תוכנה — חשבון Google, שם משתמש וסיסמה, או כניסת ניהול." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* מצב בהיר וכהה — DESIGN_STANDARD §עיצוב. הצבעים מוגדרים פעם אחת
         כמשתנים, כדי שהמצב הכהה לא יהיה סט שני של כללים שיתפצל בתיקון הראשון. */
      :root {
        color-scheme: light dark;
        --bg-1: #1b1f52;
        --bg-2: #0b0d2e;
        --card: #ffffff;
        --ink: #0b0d2e;
        --muted: #5c6178;
        --line: #d9dbe8;
        --field: #ffffff;
        --gold: #c9a227;
        --err-bg: #fdeaea;
        --err-ink: #8c1f1f;
        --ok-bg: #e9f7ef;
        --ok-ink: #15603a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-1: #131634;
          --bg-2: #06070f;
          --card: #14172f;
          --ink: #ece9f5;
          --muted: #9aa0bd;
          --line: #2c3054;
          --field: #0e1128;
          --err-bg: #3a1414;
          --err-ink: #ffb4b4;
          --ok-bg: #10301f;
          --ok-ink: #86e0ae;
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: 'Heebo', system-ui, sans-serif; color: var(--ink);
        background: radial-gradient(1200px 600px at 70% -10%, var(--bg-1) 0%, var(--bg-2) 60%);
        padding: 24px;
      }
      .card {
        width: 100%; max-width: 430px; background: var(--card); color: var(--ink);
        border-radius: 18px; padding: 28px; box-shadow: 0 30px 70px rgba(0,0,0,.4);
        border: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--gold);
             box-shadow: 0 0 0 4px rgba(201,162,39,.25); flex: none; }
      h1 { font-family: 'Secular One', sans-serif; font-size: 22px; margin: 0; }
      p.lead { margin: 6px 0 20px; font-size: 14px; color: var(--muted); line-height: 1.7; }
      label { display: block; font-size: 12px; font-weight: 700; margin: 14px 0 6px; }
      .hint { font-weight: 400; color: var(--muted); }
      input {
        width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px;
        font-size: 15px; font-family: inherit; direction: ltr; text-align: start;
        background: var(--field); color: var(--ink); min-height: 44px;
      }
      input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
      button {
        width: 100%; padding: 12px; border: 0; border-radius: 10px;
        font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
        min-height: 44px;
      }
      #submit { margin-top: 20px; background: var(--ink); color: var(--card); }
      button:disabled { opacity: .6; cursor: progress; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
      /* כניסת Google — נחשפת רק אם הספק באמת דלוק (נבדק מול /auth/v1/settings).
         כפתור שמוביל ל-400 גרוע יותר מכפתור שאינו קיים. */
      #google { display: none; align-items: center; justify-content: center; gap: 10px;
        background: var(--field); color: var(--ink); border: 1px solid var(--line); margin-bottom: 4px; }
      #google[data-on='1'] { display: flex; }
      #google:hover { border-color: var(--gold); }
      #google svg { width: 18px; height: 18px; flex: none; }
      .or { display: none; align-items: center; gap: 12px; margin: 18px 0 4px;
            color: var(--muted); font-size: 12px; }
      .or[data-on='1'] { display: flex; }
      .or::before, .or::after { content: ''; height: 1px; background: var(--line); flex: 1; }
      .msg { margin-top: 14px; font-size: 13px; line-height: 1.7; border-radius: 10px; padding: 11px 13px; }
      .msg.err { background: var(--err-bg); color: var(--err-ink); }
      .msg.ok  { background: var(--ok-bg); color: var(--ok-ink); }
      .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
              font-size: 12px; color: var(--muted); line-height: 2; }
      .foot a { color: var(--ink); font-weight: 600; display: inline-flex; align-items: center;
                min-height: 24px; }
      .who { display: none; }
      #signout { background: var(--field); color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="dot"></span><h1>כניסה למערכות</h1></div>
      <p class="lead">
        חשבון אחד לכל מערכות מור מערכות תוכנה. אותה כניסה בכל מערכת, ואותו
        אזור אישי — לא צריך להירשם מחדש בכל פעם.
      </p>

      <button id="google" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.2-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.64v3.02h3.88c2.27-2.09 3.55-5.17 3.55-8.9z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.91l-3.88-3.02c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.12A12 12 0 0 0 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.27a7.2 7.2 0 0 1 0-4.54V6.61H1.29a12 12 0 0 0 0 10.78l3.98-3.12z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.29 6.61l3.98 3.12C6.22 6.86 8.87 4.75 12 4.75z"/>
        </svg>
        <span>המשך עם Google</span>
      </button>

      <div class="or" id="or"><span>או</span></div>

      <form id="form" novalidate>
        <label for="ident">שם משתמש או כתובת אימייל</label>
        <input id="ident" name="ident" type="text" autocomplete="username"
               autocapitalize="off" autocorrect="off" spellcheck="false" required
               aria-describedby="identHint" />
        <p id="identHint" class="lead" style="margin:6px 0 0;font-size:12px">
          שם משתמש בלבד (בלי @) נחשב לחשבון פנימי של הפלטפורמה.
        </p>

        <label for="password">סיסמה</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="submit" type="submit">כניסה</button>
      </form>

      <div id="msg" class="msg" hidden role="status" aria-live="polite"></div>

      <div id="who" class="who">
        <p class="lead" id="whoText"></p>
        <button id="signout" type="button">יציאה</button>
      </div>

      <p class="foot">
        <a href="/admin">כניסת ניהול — מרכז השליטה</a><br />
        אין לך חשבון, או שכחת סיסמה? פנה למנהל המערכת.<br />
        <a href="/">חזרה לעולם הסטארטאפים</a>
      </p>
    </main>

    <script type="module">
      // אימות אמיתי מול Supabase Auth המשותף של הפלטפורמה — אותו מאגר משתמשים
      // שכל המערכות עובדות מולו. אין כאן שכבת דמה: כניסה שנכשלת מדווחת כפי שהיא.
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      // מפתח anon/publishable — ציבורי במכוון, כמו בשאר מערכות הפלטפורמה.
      const SUPABASE_URL = 'https://uhnrgujbdxhhmoxcjria.supabase.co';
      const SUPABASE_ANON =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVobnJndWpiZHhoaG1veGNqcmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjE3MjgsImV4cCI6MjA5ODkzNzcyOH0.nHuOhw-WQEU17lNa7XOlORnBhVAYbJBHudKafWkSHBw';

      // חשבון פנימי נשמר כאימייל, כי Supabase Auth מזהה לפי אימייל בלבד.
      // הדומיין הזה הוא המיפוי: מי שמקליד `eueu1234` נכנס ל-eueu1234@more30.com.
      const INTERNAL_DOMAIN = '@more30.com';

      const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: { persistSession: true, storageKey: 'more30-auth', detectSessionInUrl: true },
      });

      const form = document.getElementById('form');
      const msg = document.getElementById('msg');
      const who = document.getElementById('who');
      const whoText = document.getElementById('whoText');
      const submit = document.getElementById('submit');
      const googleBtn = document.getElementById('google');
      const or = document.getElementById('or');

      const params = new URLSearchParams(location.search);
      const back = params.get('from');

      function show(text, kind) {
        msg.textContent = text;
        msg.className = 'msg ' + kind;
        msg.hidden = false;
      }

      // שם משתמש → אימייל. כתובת אימייל נשארת כפי שהיא.
      function toEmail(value) {
        const v = value.trim();
        return v.includes('@') ? v : v.toLowerCase() + INTERNAL_DOMAIN;
      }

      // כפתור Google מוצג רק אם הספק דלוק בפועל. כשתפעיל אותו ב-Supabase
      // הכפתור יופיע מעצמו — בלי לבנות ולפרוס את הדף מחדש.
      (async function probeGoogle() {
        try {
          const r = await fetch(SUPABASE_URL + '/auth/v1/settings', {
            headers: { apikey: SUPABASE_ANON },
          });
          if (!r.ok) return;
          const s = await r.json();
          if (s?.external?.google) {
            googleBtn.dataset.on = '1';
            or.dataset.on = '1';
          }
        } catch {
          /* אין אינדיקציה שהספק דלוק — לא מציגים כפתור שאולי יוביל לשגיאה. */
        }
      })();

      googleBtn.addEventListener('click', async () => {
        msg.hidden = true;
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: back || location.origin + '/login' },
        });
        if (error) show('הכניסה עם Google נכשלה: ' + error.message, 'err');
      });

      async function refresh() {
        const { data } = await sb.auth.getUser();
        if (!data?.user) return;
        const u = data.user;
        const label = u.user_metadata?.username || u.email;
        form.style.display = 'none';
        googleBtn.style.display = 'none';
        or.style.display = 'none';
        who.style.display = 'block';
        whoText.textContent = `מחובר כ־${label}.` + (back ? ' מחזירים אותך למערכת…' : '');
        if (back) setTimeout(() => { location.href = back; }, 1200);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.hidden = true;
        const ident = document.getElementById('ident').value;
        if (!ident.trim()) { show('חסר שם משתמש או אימייל.', 'err'); return; }
        submit.disabled = true;
        submit.textContent = 'נכנס…';
        const { error } = await sb.auth.signInWithPassword({
          email: toEmail(ident),
          password: document.getElementById('password').value,
        });
        submit.disabled = false;
        submit.textContent = 'כניסה';
        if (error) {
          show(
            error.message === 'Invalid login credentials'
              ? 'שם המשתמש או הסיסמה אינם נכונים.'
              : `הכניסה נכשלה: ${error.message}`,
            'err',
          );
          return;
        }
        show('נכנסת בהצלחה.', 'ok');
        refresh();
      });

      document.getElementById('signout').addEventListener('click', async () => {
        await sb.auth.signOut();
        location.reload();
      });

      refresh();
    </script>
  </body>
</html>
