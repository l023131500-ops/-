<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>יתרות וחיבורים · מרכז השליטה — more30</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --gold: #c9a227; --bg: #f6f7fb; --surface: #ffffff;
        --ink: #0b0d2e; --ink-2: #5b6076; --line: #e4e6f0;
        --ok: #157f4b; --warn: #8a6d10; --bad: #a4262c;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0d18; --surface: #151827; --ink: #e9ebf5;
                --ink-2: #a2a8c0; --line: #262b40;
                --ok: #5fd39b; --warn: #e0bd5a; --bad: #f08a8f; }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Heebo', system-ui, sans-serif; background: var(--bg);
             color: var(--ink); line-height: 1.6; padding: 28px 20px 80px; }
      .wrap { max-width: 1180px; margin: 0 auto; }
      .back { display: inline-flex; align-items: center; min-height: 24px;
              font-size: 14px; color: var(--ink-2); text-decoration: none; }
      .back:hover { color: var(--ink); }
      h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; margin-top: 10px; }
      .sub { color: var(--ink-2); font-size: 15px; margin-top: 6px; max-width: 70ch; }
      .nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
      .nav a { font-size: 13.5px; font-weight: 600; text-decoration: none;
               border: 1px solid var(--line); border-radius: 999px;
               padding: 6px 14px; min-height: 24px; display: inline-flex;
               align-items: center; color: var(--ink); background: var(--surface); }
      .nav a:hover { border-color: var(--gold); }

      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
               gap: 12px; margin: 20px 0 26px; }
      .kpi { background: var(--surface); border: 1px solid var(--line);
             border-radius: 14px; padding: 14px 16px; }
      .kpi .n { font-size: 27px; font-weight: 800; line-height: 1.1; }
      .kpi .l { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }

      .grid { display: grid; gap: 12px;
              grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
      .p { background: var(--surface); border: 1px solid var(--line);
           border-radius: 14px; padding: 16px 18px; display: flex;
           flex-direction: column; gap: 8px; }
      .p h2 { font-size: 16.5px; font-weight: 800; }
      .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
      .tag.ok   { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
      .tag.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
      .tag.bad  { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
      .tag.off  { background: color-mix(in srgb, var(--ink-2) 16%, transparent); color: var(--ink-2); }
      .used { color: var(--ink-2); font-size: 13px; }
      .detail { font-size: 13.5px; }

      /* מד היתרה. מוצג רק כשיש מדידה אמיתית — עמודה ריקה ליד ספק שלא
         מפרסם יתרה נקראת כמו "אפס נשאר", וזה בדיוק הבלבול שהמסך נועד למנוע. */
      .meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
      .meter > i { display: block; height: 100%; background: var(--ok); }
      .meter.hot > i { background: var(--warn); }
      .meter.crit > i { background: var(--bad); }
      .num { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13.5px; }

      .act { display: inline-flex; align-items: center; min-height: 24px;
             align-self: flex-start; font-size: 13px; font-weight: 700;
             text-decoration: none; color: var(--ink);
             border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
      .act:hover { border-color: var(--gold); }
      .muted { color: var(--ink-2); }
      .note { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
              font-size: 14px; background: var(--surface); margin-top: 16px; }
      .note.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
      .foot { margin-top: 22px; font-size: 12.5px; color: var(--ink-2); }
    </style>
      <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/admin">← חזרה למרכז השליטה</a>
      <h1>יתרות וחיבורים</h1>
      <p class="sub" id="tagline">טוען…</p>

      <nav class="nav">
        <a href="/admin/smel">smel — לידי מחקר</a>
        <a href="/admin/systems">דוח מערכות</a>
        <a href="/admin/pricing">מחירים ותצוגה</a>
        <a href="/admin/activity">משתמשים פעילים</a>
        <a href="/admin/customers">לקוחות</a>
        <a href="/admin/leads">לידים</a>
        <a href="/admin/automation">אוטומציית תוכן</a>
        <a href="/admin/rights">מאגר הזכויות</a>
        <a href="/admin/issues">תקלות ומה דורש אותך</a>
        <a href="/admin/kesef">כסף — קליטת נתונים</a>
        <a href="/admin/imud">עימוד — ספרים ותבניות</a>
        <a href="/admin/orech">העורך התורני — HTR</a>
        <a href="/admin/studio">סטודיו — תבניות ועבודות</a>
      </nav>

      <div id="content" hidden>
        <div class="cards" id="kpis"></div>
        <div class="grid" id="grid"></div>
        <div class="note" id="legend"></div>
        <p class="foot" id="stamp"></p>
      </div>
      <div id="denied" class="note warn" hidden></div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
      const SUPABASE_URL = 'https://uhnrgujbdxhhmoxcjria.supabase.co';
      const SUPABASE_ANON =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVobnJndWpiZHhoaG1veGNqcmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjE3MjgsImV4cCI6MjA5ODkzNzcyOH0.nHuOhw-WQEU17lNa7XOlORnBhVAYbJBHudKafWkSHBw';
      const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: { persistSession: true, storageKey: 'more30-auth' },
      });
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

      const TAGS = {
        ok:             ['ok',   'פועל'],
        invalid:        ['bad',  'נדחה'],
        missing:        ['off',  'אין מפתח'],
        'not-deployed': ['warn', 'לא נפרס'],
        unknown:        ['warn', 'לא נמדד'],
      };

      const nf = (n) => Number(n).toLocaleString('he-IL', { maximumFractionDigits: 2 });

      (async function () {
        const { data: s } = await sb.auth.getSession();
        if (!s?.session) {
          $('tagline').textContent = 'הדף פתוח לסופר-אדמין בלבד.';
          $('denied').innerHTML =
            `צריך להתחבר. <a href="/login?from=${encodeURIComponent(location.href)}">מעבר לכניסה</a>`;
          $('denied').hidden = false;
          return;
        }

        let data;
        try {
          const r = await fetch('/api/credits', {
            headers: { Authorization: 'Bearer ' + s.session.access_token },
          });
          if (!r.ok) {
            const e = await r.json().catch(() => ({}));
            throw new Error(e.error || ('HTTP ' + r.status));
          }
          data = await r.json();
        } catch (e) {
          $('tagline').textContent = 'הדף פתוח לסופר-אדמין בלבד.';
          $('denied').innerHTML =
            'לא הצלחתי לקרוא את מצב הספקים.<br><span class="muted" style="font-size:13px">' +
            esc(e.message) + '</span>';
          $('denied').hidden = false;
          return;
        }

        $('tagline').textContent =
          'לכל ספק: האם החיבור פועל, כמה נשאר כשהספק מפרסם יתרה, וקישור ישיר לעמוד ההוספה שלו.';

        const t = data.summary || {};
        $('kpis').innerHTML = [
          [t.ok, 'חיבורים פועלים'],
          [t.broken, 'מפתחות שנדחו'],
          [t.needsDeploy, 'קיימים בכספת ולא נפרסו'],
          [t.needsKey, 'ספקים בלי מפתח'],
        ].map(([n,l]) => `<div class="kpi"><div class="n">${Number(n)||0}</div><div class="l">${l}</div></div>`).join('');

        // הכי דחוף למעלה: מה שנשבר, ואז מה שקרוב לתקרה.
        const rank = { invalid: 0, unknown: 1, 'not-deployed': 2, missing: 3, ok: 4 };
        const list = [...(data.providers || [])].sort((a, b) => {
          const d = (rank[a.state] ?? 9) - (rank[b.state] ?? 9);
          if (d) return d;
          return (b.usage?.percent ?? -1) - (a.usage?.percent ?? -1);
        });

        $('grid').innerHTML = list.map((p) => {
          const [cls, label] = TAGS[p.state] || ['off', p.state];

          let meter = '';
          if (p.usage && Number(p.usage.limit) > 0) {
            const pct = Math.max(0, Math.min(100, Number(p.usage.percent) || 0));
            const heat = pct >= 90 ? 'crit' : pct >= 75 ? 'hot' : '';
            const left = Number(p.usage.limit) - Number(p.usage.used);
            meter =
              `<div class="meter ${heat}"><i style="width:${pct}%"></i></div>` +
              `<div class="num">${nf(left)} ${esc(p.usage.unit)} נותרו · ` +
              `${nf(p.usage.used)} מתוך ${nf(p.usage.limit)}` +
              (p.usage.cycleEnds
                ? ` · מתאפס ${new Date(p.usage.cycleEnds).toLocaleDateString('he-IL')}`
                : '') +
              `</div>`;
          }

          return `<article class="p">
            <div class="row1">
              <h2>${esc(p.label)}</h2>
              <span class="tag ${cls}">${esc(label)}</span>
            </div>
            <div class="used">${esc(p.usedBy)}</div>
            ${meter}
            <div class="detail">${esc(p.detail)}</div>
            <a class="act" href="${esc(p.topUp)}" target="_blank" rel="noopener noreferrer">
              ${esc(p.topUpLabel || (p.state === 'missing' ? 'פתיחת חשבון והוספת מפתח' : 'הוספת קרדיט אצל הספק'))} ↗
            </a>
          </article>`;
        }).join('');

        $('legend').innerHTML = [
          '<div>· <b>פועל</b> — המפתח התקבל על ידי הספק ברגע הבדיקה.</div>',
          '<div>· <b>לא נפרס</b> — המפתח קיים ב-<code>core.secrets</code> אבל אינו משתנה סביבה בפריסה הזאת. ' +
            'זה תיקון של העתקת ערך קיים, ולא של פתיחת חשבון — ולכן זה מצב נפרד מ״אין מפתח״.</div>',
          '<div>· <b>לא נמדד</b> — לספק אין ממשק שמחזיר יתרה, או שהוא לא ענה בזמן. ' +
            'לא מוצג כאן מספר שאין מאחוריו מדידה.</div>',
          '<div>· מד היתרה מופיע רק אצל הספקים שבאמת מפרסמים אחת: Apify, Recraft ו-ElevenLabs.</div>',
          '<div>· ספק ציבורי בלי מפתח (<code>data.gov.il</code>) נבדק בכל מקרה — היעדר מפתח אצלנו ' +
            'אינו אומר שהממשק שלו שבור, ואין לו יתרה. אצלו הקישור מוביל לקטלוג המאגרים ולא לעמוד חיוב.</div>',
          '<div>· ספק שדורש יותר ממפתח אחד נמדד על כולם: זוג שחסר בו צד אחד אינו "פועל", ' +
            'והשם החסר נאמר בשורה שלו.</div>',
        ].join('');

        $('stamp').textContent = 'נבדק ' + new Date(data.checkedAt).toLocaleString('he-IL');
        $('content').hidden = false;
      })();
    </script>
    <script src="https://more30.com/auth-button.js" defer></script>
  </body>
</html>
