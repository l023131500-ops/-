<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>מחירים ותצוגה · מרכז השליטה — more30</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --gold: #c9a227;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --ink: #0b0d2e;
        --ink-2: #5b6076;
        --line: #e4e6f0;
        --ok: #157f4b;
        --warn: #8a6d10;
        --live: #157f4b;
        --danger: #c0392b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d18; --surface: #151827; --ink: #e9ebf5;
          --ink-2: #a2a8c0; --line: #262b40; --ok: #5fd39b;
          --warn: #e0bd5a; --live: #5fd39b; --danger: #ff7a6b;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Heebo', system-ui, sans-serif;
        background: var(--bg); color: var(--ink);
        line-height: 1.6; padding: 28px 20px 80px;
      }
      .wrap { max-width: 1100px; margin: 0 auto; }
      .back {
        display: inline-flex; align-items: center; min-height: 24px;
        font-size: 14px; color: var(--ink-2); text-decoration: none;
      }
      .back:hover { color: var(--ink); }
      h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; margin-top: 10px; }
      .sub { color: var(--ink-2); font-size: 15px; margin-top: 6px; max-width: 66ch; }

      /* אותו סרגל אחים שיש לשאר מסכי הלוח. שבעה מהם מקשרים לכאן, וכאן
         "חזרה למרכז השליטה" הייתה היציאה היחידה — והיא מובילה אל ‎/admin‎,
         SPA שאינו מקשר בחזרה לאף אחד ממסכי הלוח. */
      .nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
      .nav a { font-size: 13.5px; font-weight: 600; text-decoration: none;
               border: 1px solid var(--line); border-radius: 999px;
               padding: 6px 14px; min-height: 24px; display: inline-flex;
               align-items: center; color: var(--ink); background: var(--surface); }
      .nav a:hover { border-color: var(--gold); }

      .legend {
        display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 22px 0 10px;
        font-size: 13px; color: var(--ink-2);
      }
      .legend b { color: var(--ink); font-weight: 700; }

      .sys {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
      }
      .sys-head {
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        margin-bottom: 12px;
      }
      .sys-num {
        font-variant-numeric: tabular-nums; font-weight: 800;
        color: var(--ink-2); font-size: 13px; min-width: 26px;
      }
      .sys-name { font-weight: 700; font-size: 16px; }
      .sys-name a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
      .sys-name a:hover { border-bottom-color: var(--gold); }
      .tag {
        font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
        background: color-mix(in srgb, var(--live) 16%, transparent); color: var(--live);
      }
      .tag.off { background: color-mix(in srgb, var(--ink-2) 16%, transparent); color: var(--ink-2); }

      .rows { display: grid; gap: 8px; }
      .row {
        display: grid; grid-template-columns: 1fr 130px 92px auto;
        gap: 10px; align-items: center;
      }
      @media (max-width: 640px) { .row { grid-template-columns: 1fr 110px 80px; } }
      .kind { font-size: 14px; }
      .kind small { display: block; color: var(--ink-2); font-size: 11.5px; }
      input[type='number'] {
        width: 100%; font: inherit; font-size: 15px; text-align: start;
        padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line);
        background: var(--bg); color: var(--ink); min-height: 40px;
      }
      input[type='number']:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
      button {
        font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
        border: 1px solid var(--line); background: var(--bg); color: var(--ink);
        border-radius: 9px; padding: 8px 14px; min-height: 40px; min-width: 72px;
      }
      button:hover { border-color: var(--gold); }
      button:disabled { opacity: .5; cursor: default; }
      /* שורה שאינה מגיעה ללקוח: אותו טיפוגרפיה, פחות משקל. לא אזהרה — עובדה. */
      .mut { color: var(--ink-2); }
      .blocked-note {
        font-size: 12.5px; color: var(--ink-2); margin: -4px 0 12px;
        padding-inline-start: 10px;
        border-inline-start: 2px solid color-mix(in srgb, var(--ink-2) 40%, transparent);
      }
      .state { font-size: 12px; min-height: 18px; }
      .state.ok { color: var(--ok); }
      .state.warn { color: var(--warn); }
      .state.err { color: #c0392b; }

      .showcase {
        display: flex; align-items: center; gap: 8px; margin-inline-start: auto;
        font-size: 13px; color: var(--ink-2);
      }
      .showcase input { width: 20px; height: 20px; accent-color: var(--gold); }

      .note {
        border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
        font-size: 14px; background: var(--surface); margin-top: 14px;
      }
      .note.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
      /* סליקה פעילה אינה "שים לב" — משם והלאה כל שמירה נוגעת בכסף אמיתי. */
      .note.danger {
        border-color: var(--danger); border-width: 2px;
        background: color-mix(in srgb, var(--danger) 8%, var(--surface));
      }
      .note code { font-family: ui-monospace, monospace; font-size: 13px; }
      .foot { margin-top: 26px; font-size: 12.5px; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/admin">← חזרה למרכז השליטה</a>
      <h1>מחירים ותצוגה</h1>
      <p class="sub" id="tagline">טוען…</p>

      <nav class="nav">
        <a href="/admin/systems">דוח מערכות</a>
        <a href="/admin/customers">לקוחות</a>
        <a href="/admin/leads">לידים</a>
        <a href="/admin/issues">תקלות ומה דורש אותך</a>
        <a href="/admin/credits">יתרות וחיבורים</a>
        <a href="/admin/activity">משתמשים פעילים</a>
      </nav>

      <div id="content" hidden>
        <div class="legend">
          <span><b>ריק</b> = טרם נקבע. סליקה חסומה.</span>
          <span><b>0</b> = הוחלט: ללא חיוב. המערכת פעילה.</span>
          <span><b>מעל 0</b> = מחיר לגבייה.</span>
        </div>

        <!--
          האזהרה הזאת הייתה טקסט קבוע שאמר "הסליקה אינה מחוברת". היא נכונה היום,
          אבל core.billing_settings נפתחת ב-UPDATE יחיד ובלי פריסה — ואז המסך היה
          ממשיך להרגיע מעל מחירים שכבר נגבים. עכשיו היא נקראת מהמתג עצמו.
        -->
        <div class="note warn" id="billing"></div>

        <div id="systems"></div>
        <p class="foot" id="stamp"></p>
      </div>

      <div id="denied" class="note warn" hidden></div>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const SUPABASE_URL = 'https://uhnrgujbdxhhmoxcjria.supabase.co';
      const SUPABASE_ANON =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVobnJndWpiZHhoaG1veGNqcmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNjE3MjgsImV4cCI6MjA5ODkzNzcyOH0.nHuOhw-WQEU17lNa7XOlORnBhVAYbJBHudKafWkSHBw';

      const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
        auth: { persistSession: true, storageKey: 'more30-auth' },
      });

      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
        );

      const KIND_LABEL = {
        subscription: ['מנוי', 'חיוב חוזר'],
        charge: ['סליקה', 'תשלום כללי'],
        one_time: ['שימוש חד-פעמי', 'תשלום לפעולה'],
      };

      function deny(msg) {
        $('tagline').textContent = 'המסך הזה פתוח לסופר-אדמין בלבד.';
        $('denied').innerHTML = msg;
        $('denied').hidden = false;
      }

      (async function () {
        const { data: s } = await sb.auth.getSession();
        if (!s?.session) {
          deny(
            'צריך להתחבר. ' +
              `<a href="/login?from=${encodeURIComponent(location.href)}">מעבר לכניסה</a>`,
          );
          return;
        }

        // ההרשאה נבדקת בשרת: הפונקציה זורקת 42501 למי שאינו סופר-אדמין.
        const { data, error } = await sb.rpc('more30_admin_pricing_list');
        if (error) {
          deny(
            'החשבון הזה אינו סופר-אדמין, ולכן אינו יכול לקבוע מחירים.' +
              `<br><span style="color:var(--ink-2);font-size:13px">${esc(error.message)}</span>`,
          );
          return;
        }

        $('tagline').textContent =
          'שמירה כותבת מיד ל-core.plans, ומשתקפת באתר הלקוח. כל שינוי נרשם ביומן.';

        // ── מצב הסליקה, מהמתג ולא מהזיכרון ──────────────────────────────
        // שלושה מצבים ולא שניים. "אין תשובה" אינו "סגור": טבלה ריקה או שדה
        // חסר אומרים שאיננו יודעים, ולהציג במקומם הרגעה זו בדיוק הטעות שהמסך
        // הזה עשה עד היום.
        const b = data.billing;
        const priced = Number(data.chargeable_plans ?? 0);
        // 0036: כמה מתוך המתומחרים לקוח יכול בכלל להגיע אליהם. עד היום הבאנר
        // הבטיח שכל 70 ייגבו ברגע שהמתג ייפתח, ו-31 מהם אינם ניתנים להצעה:
        // 29 שורות "פרו" נסתרות, ושתי שורות של mechiron שהקופה מסרבת למכור.
        // null = ה-RPC ישן ולא החזיר את השדה; אז לא נמציא מספר.
        const offerable =
          data.offerable_plans == null ? null : Number(data.offerable_plans);
        const unreachable = offerable == null ? null : priced - offerable;
        const gapText =
          unreachable == null
            ? ''
            : unreachable > 0
            ? ` מתוכם <b>${offerable}</b> ניתנים להצעה ללקוח, ו-${unreachable} אינם — ` +
              'מסלול נסתר, או מערכת שהקופה מסרבת למכור. אלה לא ייגבו גם אחרי שהמתג ייפתח.'
            : ' וכולם ניתנים להצעה ללקוח.';
        const el = $('billing');
        const stamp = b?.updated_at
          ? ` נקבע לאחרונה ${new Date(b.updated_at).toLocaleDateString('he-IL')}.`
          : '';
        if (!b || !b.mode) {
          el.className = 'note warn';
          el.innerHTML =
            '<b>מצב הסליקה אינו ידוע.</b> ‏<code>core.billing_settings</code> לא החזירה ' +
            'שורה, ולכן אי אפשר להבטיח כאן שאיש אינו מחויב. אל תקבע מחיר לגבייה ' +
            'לפני שהמתג נקרא.';
        } else if (b.chargeable) {
          el.className = 'note danger';
          el.innerHTML =
            `<b>הסליקה פעילה — ${esc(b.mode)} מול ${esc(b.provider)}.</b> ` +
            `שמירה כאן משנה סכום שנגבה בפועל, ו-${priced} מסלולים פעילים כבר ` +
            'נושאים מחיר גדול מאפס.' +
            gapText +
            esc(stamp);
        } else {
          el.className = 'note warn';
          el.innerHTML =
            `<b>הסליקה סגורה.</b> ‏<code>core.billing_settings.mode=${esc(b.mode)}</code>` +
            (b.provider ? ` · ספק ${esc(b.provider)}` : ' ואין ספק מחובר') +
            `, ולכן אף אחד אינו מחויב בפועל — אבל ${priced} מסלולים פעילים כבר ` +
            'נושאים מחיר גדול מאפס.' +
            gapText +
            ' מסלול <b>"פרו (בדיקה)"</b> נקבע ל-1 ₪ בכל מערכת כדי לאפשר בדיקה ' +
            'בסכום זניח, והוא נסתר מהלקוח.' +
            esc(stamp);
        }

        $('systems').innerHTML = (data.systems || [])
          .map((sys) => {
            const rows = (sys.plans || [])
              .map((p) => {
                const [lbl, sub] = KIND_LABEL[p.billing_kind] ?? [p.name_he, p.code];
                const id = `${sys.app_key}::${p.code}`;
                // 0036: השורה יודעת עכשיו אם היא מגיעה ללקוח. "פרו" סומן
                // בשמו בלבד, ושתי שורות נסתרות נוספות בכל מערכת — "סליקה"
                // ו"שימוש חד-פעמי" — נראו בדיוק כמו מסלול נמכר.
                const hidden = p.customer_visible === false;
                const blocked = sys.sellable === false;
                return `<div class="row">
                  <div class="kind">${esc(lbl)}${
                    p.code === 'pro' ? ' — <b>פרו (בדיקה)</b>' : ''
                  }${hidden ? ' <span class="mut">· נסתר מהלקוח</span>' : ''}<small>${esc(
                  sub,
                )} · ${esc(p.code)}</small></div>
                  <input type="number" min="0" step="0.5" inputmode="decimal"
                         id="in::${esc(id)}" value="${p.price_ils ?? ''}"
                         placeholder="טרם נקבע"
                         aria-label="מחיר ${esc(lbl)} עבור ${esc(sys.name)}" />
                  <button data-app="${esc(sys.app_key)}" data-code="${esc(p.code)}"
                          data-reach="${blocked ? 'blocked' : hidden ? 'hidden' : 'open'}">שמור</button>
                  <span class="state" id="st::${esc(id)}">${
                    p.price_ils == null
                      ? '<span class="warn">טרם נקבע</span>'
                      : p.price_ils === 0
                      ? 'ללא חיוב'
                      : blocked
                      ? '<span class="mut">לא נמכר · המערכת חסומה</span>'
                      : hidden
                      ? '<span class="mut">לא נמכר · נסתר</span>'
                      : 'לגבייה'
                  }</span>
                </div>`;
              })
              .join('');

            return `<section class="sys">
              <div class="sys-head">
                <span class="sys-num">${esc(sys.number)}</span>
                <span class="sys-name">${
                  sys.live_url
                    ? `<a href="${esc(sys.live_url)}">${esc(sys.name)}</a>`
                    : esc(sys.name)
                }</span>
                <span class="tag ${sys.live ? '' : 'off'}">${sys.live ? 'חי' : 'לא חי'}</span>
                ${
                  sys.sellable === false
                    ? `<span class="tag off">לא מוצע למכירה</span>`
                    : ''
                }
                <label class="showcase">
                  <input type="checkbox" data-showcase="${esc(sys.app_key)}"
                         ${sys.show_in_showcase ? 'checked' : ''} />
                  הצג בעולם הסטארטאפים
                </label>
              </div>
              ${
                sys.offer_note
                  ? `<p class="blocked-note">${esc(sys.offer_note)} מחיר שנקבע כאן
                     נשמר בקטלוג, ולא יוצג ללקוח כל עוד המערכת חסומה.</p>`
                  : ''
              }
              <div class="rows">${rows}</div>
            </section>`;
          })
          .join('');

        // ── שמירת מחיר ──────────────────────────────────────────────────
        $('systems').addEventListener('click', async (e) => {
          const btn = e.target.closest('button[data-app]');
          if (!btn) return;
          const app = btn.dataset.app;
          const code = btn.dataset.code;
          const input = $(`in::${app}::${code}`);
          const state = $(`st::${app}::${code}`);
          const raw = input.value.trim();
          // ריק נשמר כ-null בכוונה: זה "טרם נקבע", ולא אפס.
          const price = raw === '' ? null : Number(raw);
          if (price !== null && (!Number.isFinite(price) || price < 0)) {
            state.className = 'state err';
            state.textContent = 'מספר לא תקין';
            return;
          }

          btn.disabled = true;
          state.className = 'state';
          state.textContent = 'שומר…';
          const { data: res, error: err } = await sb.rpc('more30_admin_pricing_set', {
            p_app: app, p_code: code, p_price: price,
          });
          btn.disabled = false;
          if (err) {
            state.className = 'state err';
            state.textContent = err.message.slice(0, 60);
            return;
          }
          state.className = 'state ok';
          // אותה הבחנה שבציור הראשוני: שמירה מוצלחת על שורה שאינה מגיעה
          // ללקוח אינה "לגבייה", גם כשהמחיר נשמר.
          const reach = btn.dataset.reach;
          state.textContent = !res.chargeable
            ? price === null
              ? 'נשמר · טרם נקבע'
              : 'נשמר · ללא חיוב'
            : reach === 'blocked'
            ? 'נשמר · לא נמכר · המערכת חסומה'
            : reach === 'hidden'
            ? 'נשמר · לא נמכר · נסתר'
            : 'נשמר · לגבייה';
        });

        // ── מתג showcase ────────────────────────────────────────────────
        $('systems').addEventListener('change', async (e) => {
          const box = e.target.closest('input[data-showcase]');
          if (!box) return;
          const app = box.dataset.showcase;
          box.disabled = true;
          const { error: err } = await sb.rpc('more30_admin_showcase_set', {
            p_app: app, p_flag: box.checked,
          });
          box.disabled = false;
          if (err) {
            box.checked = !box.checked; // החזרה למצב האמיתי אם השמירה נכשלה
            alert('לא נשמר: ' + err.message);
          }
        });

        $('stamp').textContent = 'נטען ' + new Date(data.generated_at).toLocaleString('he-IL');
        $('content').hidden = false;
      })();
    </script>

    <script src="https://more30.com/auth-button.js" defer></script>
  </body>
</html>
