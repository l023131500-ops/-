<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>הכתובת לא נמצאה · עולם הסטארטאפים</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0B0D2E" />
    <!-- העמוד שוורסל מגיש בסטטוס 404 לכל כתובת שאין מאחוריה מערכת (באג #119).
         הוא חייב לעמוד בפני עצמו: הוא נטען *במקום* ה-SPA, ולכן אין לו גישה
         ל-styles.css של הבאנדל. הצבעים והמידות מועתקים מ-:root ומ-.soon
         שב-portal/src/styles.css — אותו עמוד בדיוק, בלי JavaScript. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@300&family=Heebo:wght@300;400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      :root {
        color-scheme: dark;
        --royal: #0B0D2E;
        --gold: #C9A227;
        --gold-soft: #E3C765;
        --ink: #ECE9F5;
        --ink-2: #B9B6D6;
        --line: rgba(201, 162, 39, 0.20);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Heebo', system-ui, sans-serif;
        font-weight: 300;
        color: var(--ink);
        background: var(--royal);
        -webkit-font-smoothing: antialiased;
      }
      ::selection { background: var(--gold); color: var(--royal); }
      a { color: inherit; text-decoration: none; }

      .soon { min-height: 100vh; display: grid; place-items: center; padding: 40px 32px; text-align: center; }
      .soon-in { max-width: 620px; }
      .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.24em; color: var(--gold); }
      .display { font-family: 'Suez One', 'Heebo', system-ui, sans-serif; font-weight: 400; letter-spacing: -0.005em; }
      .serif { font-family: 'Frank Ruhl Libre', Georgia, serif; font-weight: 300; }
      .soon-title { font-size: clamp(34px, 6vw, 62px); margin: 20px 0 0; color: var(--ink); }
      .soon-desc { font-size: 19px; line-height: 1.85; color: var(--ink-2); margin: 22px 0 0; }
      .rule { height: 1px; background: var(--line); margin: 34px auto; max-width: 120px; }
      .soon-note { font-size: 14px; color: var(--gold); letter-spacing: 0.08em; margin: 0 0 30px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        font-family: 'Heebo', system-ui, sans-serif; font-size: 15px; font-weight: 400;
        padding: 13px 30px; border: 1px solid var(--gold); border-radius: 2px;
        background: var(--gold); color: var(--royal);
        transition: background 0.25s var(--ease), color 0.25s var(--ease), box-shadow 0.25s var(--ease);
      }
      .btn:hover { background: transparent; color: var(--gold-soft); box-shadow: 0 0 0 1px var(--gold) inset; }
    </style>
  </head>
  <body>
    <main class="soon">
      <div class="soon-in">
        <div class="eyebrow">עולם הסטארטאפים</div>
        <h1 class="display soon-title">הכתובת הזו לא נמצאה</h1>
        <p class="serif soon-desc">
          אין מערכת שיושבת תחת הכתובת הזו. ייתכן שהיא הוקלדה אחרת, או שהיא הובילה
          למשהו שכבר אינו באוויר. כל המערכות הפעילות מרוכזות בדף אחד.
        </p>
        <div class="rule"></div>
        <p class="soon-note" id="addr">404 · more30.com</p>
        <a class="btn" href="/">לרשימת המערכות</a>
      </div>
    </main>
    <!-- הכתובת שנכשלה, לטובת מי שמדווח עליה. העמוד קריא ומלא גם בלי הסקריפט. -->
    <script>
      document.getElementById('addr').textContent =
        '404 · ' + location.host + decodeURI(location.pathname);
    </script>
  </body>
</html>
