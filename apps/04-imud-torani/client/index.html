<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ ‎maximum-scale‎ / ‎user-scalable=no‎ הוסרו: הם מונעים מהמשתמש
         להגדיל את העמוד, וזה כשל נגישות לפי DESIGN_STANDARD §5 (תקן 5568).
         בעמוד עברי צפוף זו בדיוק היכולת שמי שמתקשה לקרוא זקוק לה. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- מצב כהה (DESIGN_STANDARD §3). הערכה הכהה כבר קיימת ב-‎index.css‎
         כטוקני ‎.dark‎ — נמדד ב-‎scripts/qa/dark-probe.mjs‎ שהוספת המחלקה
         מעבירה את הרקע מ-‎rgb(250,248,245)‎ ל-‎rgb(27,22,19)‎. מה שחסר היה
         מי שיוסיף אותה. השורות האלה יושבות בתוך ה-‎<head>‎ ורצות לפני הציור
         הראשון, ולכן אין הבזק לבן — בניגוד להחלה מתוך React, שרצה רק אחרי
         שהעמוד כבר צויר בהיר. -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (dark) {
          document.documentElement.classList.toggle("dark", dark);
        };
        apply(mq.matches);
        mq.addEventListener
          ? mq.addEventListener("change", function (e) { apply(e.matches); })
          : mq.addListener(function (e) { apply(e.matches); });
      })();
    </script>
    <title>אות ודף — מנוע עימוד תורני</title>
    <meta name="description" content="מערכת עימוד תורני מקצועית ללא ידע גרפי: בחר תבנית, הזן תוכן, ייצא PDF מהודר לספרי קודש." />
    <!-- ⚠️ הקידומת `/imud/` נכתבת ביד ובכוונה. `href` מוחלט-לשורש נפתר מול
         ה-origin ולא מול המונט, ו-Vite **אינו** מוסיף את ה-`base` לשורה הזו
         (נבדק על `dist/index.html`). השורה שהייתה כאן הצביעה על `/favicon.png`
         — קובץ שלמערכת הזו אין — ונענתה במקרה על ידי הסמל של הפורטל
         ב-more30.com, כלומר הלשונית הציגה סמל של אתר אחר. -->
    <link rel="icon" type="image/svg+xml" href="/imud/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- טעינה לא-חוסמת: preload + מעבר ל-stylesheet רק אחרי טעינה (loadCSS
         pattern). המשקל המקורי (11 משפחות גופנים ב-<link rel="stylesheet">
         סינכרוני) היה render-blocking-insight, ~300ms חיסכון אפשרי. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=David+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@300;400;500;700&family=Noto+Rashi+Hebrew:wght@400;500;700&family=Suez+One&family=Cardo:ital,wght@0,400;0,700;1,400&family=Rubik:wght@300;400;500;700&family=Alef:wght@400;700&family=Miriam+Libre:wght@400;700&family=Bellefair&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=David+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@300;400;500;700&family=Noto+Rashi+Hebrew:wght@400;500;700&family=Suez+One&family=Cardo:ital,wght@0,400;0,700;1,400&family=Rubik:wght@300;400;500;700&family=Alef:wght@400;700&family=Miriam+Libre:wght@400;700&family=Bellefair&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@300;400;500;700;900&family=David+Libre:wght@400;500;700&family=Noto+Serif+Hebrew:wght@300;400;500;700&family=Noto+Rashi+Hebrew:wght@400;500;700&family=Suez+One&family=Cardo:ital,wght@0,400;0,700;1,400&family=Rubik:wght@300;400;500;700&family=Alef:wght@400;700&family=Miriam+Libre:wght@400;700&family=Bellefair&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <!-- כפתור הכניסה המשותף של more30 (DESIGN_STANDARD §9). חייב לשבת
         כאן במקור ולא רק בעותק הפרוס: כל בנייה מחדש דורסת את ‎index.html‎
         שב-‎_deploy‎, ואז הכפתור נעלם בלי שאיש ישים לב. -->
    <script src="https://more30.com/auth-button.js" defer></script>
  </body>
</html>
