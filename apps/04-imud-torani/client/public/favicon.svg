<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="אות ודף">
  <!--
    סמל הלשונית של imud (04-imud-torani).

    כל ערך כאן הועתק מהחי ולא נבחר, וכולם נמדדו ב-more30.com/imud בדפדפן אמיתי
    לפני שנכתב הקובץ (getComputedStyle על ה-DOM, לא קריאת קוד):

      הגליף  rgb(134, 39, 56)   ‏= הטוקן primary ‏(349 55% 34%), הצבע שבו
                                 SiteHeader.tsx מצייר את הסימן בפועל
      האריח  rgb(250, 248, 245) ‏= הטוקן background ‏(40 33% 97%), המשטח שעליו
                                 הסימן החי יושב (סרגל הנווט, ‏0.85 שקיפות מעליו)

    שני נתיבי הספר הועתקו כלשונם מ-SiteHeader.tsx:14-21 — אותו רכיב שמורכב
    חי ב-Home, ב-Templates וב-Wizard (ולא רכיב מת).

    ניגודיות הזוג החי היא 8.4:1, הרבה מעל המינימום 3:1 לגרפיקה — ולכן, בשונה
    מ-egod, לא הוחלף כאן שום זוג טוקנים.

    שלוש סטיות מהחי, כולן בגלל 16px, וכולן מוצהרות:

    1. נוסף אריח. הסימן החי הוא קו בלבד בלי משטח משלו; קו בלבד על לשונית יוצא
       שקוף ונבלע גם בכרום בהיר וגם בכהה. האריח נושא את צבע המשטח שהסימן החי
       באמת יושב עליו, ולכן הזוג לא השתנה.
    2. עובי הקו 2.2 בחי, וכאן 4 לפני קנה מידה 0.86 — כלומר 3.44 אפקטיביים,
       שהם 1.15px ב-16px. ‏2.2 היה יוצא 0.63px, כלומר פחות מפיקסל.
    3. האות א' המסוגננת (הנתיב השלישי, עובי 1.4 בשקיפות 0.55) הוסרה. ב-16px
       פנים הספר הוא כ-4px לכל צד, ושלושה קווים חוצים שם אינם נקראים כאות אלא
       סותמים את הצורה.

    מה שנבחר ולא נמדד, ונאמר במפורש: רדיוס האריח. לסימן החי אין אריח ולכן אין
    לו רדיוס למדוד. נלקח הטוקן radius של המערכת (0.5rem = 8px) כ-8 יחידות
    בתיבה בת 48 — פרשנות, לא העתקה.
  -->
  <rect width="48" height="48" rx="8" fill="#FAF8F5"/>
  <g transform="translate(24 24) scale(0.86) translate(-24 -23)"
     fill="none" stroke="#862738" stroke-width="4" stroke-linejoin="round">
    <path d="M24 10C19 6.5 11 6.5 6 8.5V38C11 36 19 36 24 39.5C29 36 37 36 42 38V8.5C37 6.5 29 6.5 24 10Z"/>
    <path d="M24 10V39.5"/>
  </g>
</svg>
