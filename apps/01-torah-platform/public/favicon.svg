<!--
  סמל הלשונית של torah.

  הבאג שהקובץ הזה נולד ממנו אינו כאן אלא ב-index.html: השורה הצהירה
  href="/favicon.svg", נתיב מוחלט-לשורש, ומונט שיושב תחת נתיב פותר אותו
  מול ה-origin ולא מול המונט. מי שנענה בייצור היה more30.com/favicon.svg,
  כלומר הסמל של הפורטל. הקובץ הזה לא היה קיים כלל, ואיש לא ביקש אותו.

  הצבעים נמדדו על ה-DOM החי של more30.com/torah, לא נבחרו כאן.
  getComputedStyle על אריח הסרגל (Navbar.tsx:63-65) החזיר רקע
  rgb(26, 47, 91) — הטוקן primary של מצב בהיר, 222 56% 23% — אות בלבן
  rgb(255, 255, 255), ורדיוס 14px על אריח 40px. הזוג לבן-על-נייבי הוא
  13.3:1, הרבה מעל 3:1 שנדרש לגרפיקה שאינה טקסט, ולכן לא הוחלף כאן
  שום זוג. לצלע 64, רדיוס 14 על 40 הוא rx=22.4.

  הגליף הוא Mic, ולא האות שהסרגל מצייר, ושתי סיבות לכך:

  (א) האות בסרגל אינה של המערכת אלא של הדייר — הענף מצייר
  site_name.charAt(0), והדייר שהמונט מגיש היום נקרא «איגוד מגידי
  השיעורים», ולכן א'. קובץ אחד למונט אין לו גישה לדייר, ואם המונט יגיש
  דייר אחר האות בסרגל תשתנה והסמל כאן לא.

  (ב) Mic הוא הסימן של המערכת עצמה: BrandLogo.tsx:1,20 מצייר אותו,
  והוא מה שהפוטר ומסך בחירת התפקיד מראים. שני הנתיבים והקו הועתקו
  כלשונם מ-lucide-react/dist/esm/icons/mic.js (v0.462.0) ולא צוירו כאן.

  היחסים הם של BrandLogo: אריח w-9 (36px) עם גליף w-4 (16px), כלומר
  הגליף הוא 44.4% מהאריח. לצלע 64 זה תיבה 28.4 ממורכזת, שהיא
  translate(17.8) scale(1.1833) על תיבת ה-24 של lucide.

  מה שכן שונה מהחי, ובמפורש: עובי הקו. lucide מצייר 2, וב-64 זה 2.37,
  שב-16px הוא פחות מפיקסל אחד. כאן נכתב 2.8. וכן, BrandLogo מבקש
  bg-gradient-gold ו-text-navy — שני שמות שאינם מוגדרים לא ב-index.css
  ולא ב-tailwind.config.ts, ולכן הסימן שם מצויר בלי רקע ובלי צבע. הזוג
  שנלקח כאן הוא זה שנמדד חי בסרגל, ולא זה שהקוד מבקש ואינו מקבל.

  שמות הטוקנים נכתבים כאן בלי שני המקפים שמקדימים אותם ב-CSS, וזו לא
  רשלנות: הערת XML אינה יכולה להכיל שני מקפים רצופים.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="איגוד השיעורים">
  <rect width="64" height="64" rx="22.4" fill="#1A2F5B"/>
  <g transform="translate(17.8 17.8) scale(1.1833)"
     fill="none" stroke="#FFFFFF" stroke-width="2.8"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    <line x1="12" x2="12" y1="19" y2="22"/>
  </g>
</svg>
