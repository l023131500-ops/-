<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ ‎maximum-scale‎ / ‎user-scalable=no‎ הוסרו: הם מונעים מהמשתמש
         להגדיל את העמוד, וזה כשל נגישות לפי DESIGN_STANDARD §5 (תקן 5568).
         בעמוד עברי צפוף זו בדיוק היכולת שמי שמתקשה לקרוא זקוק לה. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- מצב כהה (DESIGN_STANDARD §3). טוקני ‎.dark‎ נוספו ב-‎src/index.css‎;
         כאן מדליקים אותם. רץ בתוך ה-‎<head>‎ לפני הציור הראשון, ולכן אין
         הבזק לבן — בניגוד להחלה מתוך React, שרצה רק אחרי הציור. -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (dark) {
          document.documentElement.classList.toggle("dark", dark);
        };
        apply(mq.matches);
        mq.addEventListener
          ? mq.addEventListener("change", function (e) { apply(e.matches); })
          : mq.addListener(function (e) { apply(e.matches); });
      })();
    </script>
    <title>מחוברים — בתי כנסת חצור הגלילית</title>
    <meta name="description" content="מחוברים — איגוד בתי הכנסת בחצור הגלילית. זמני תפילות, שיעורים ופעילויות קהילתיות.">
    <meta name="author" content="מחוברים — יהדות וקהילה" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="מחוברים" />
    <!-- ‎vite-plugin-pwa‎ מזריק בעצמו ‎<link rel="manifest">‎ עם ה-‎base‎ של
         ההרכבה (‎/galil/manifest.webmanifest‎). הצהרה ידנית כאן קדמה לו,
         נכתבה מוחלטת-לשורש, וקדמה גם בסדר ה-‎<head>‎ — ולכן הדפדפן לקח אותה
         וביקש ‎more30.com/manifest.webmanifest‎, שאינו קיים. אין להחזירה. -->
    <link rel="apple-touch-icon" href="/pwa-512.png" />
    <!-- סמל הלשונית (§6). לא הייתה כאן שום ‎<link rel="icon">‎, ולכן הדפדפן
         נפל לברירת המחדל שלו — ‎/favicon.ico‎ על ה-origin, כלומר
         ‎more30.com/favicon.ico‎ שהוא הסמל של הפורטל (805 בתים) ולא של
         המערכת. ‎public/favicon.ico‎ שישב כאן מעולם לא נתבקש (איש לא הצביע
         עליו, והדפדפן מבקש את השורש) והיה ממילא ברירת המחדל של הבנאי —
         אותו קובץ בדיוק, ‎SHA256 dd821076…‎, ב-‎egod‎, ‎mthbram‎, ‎zchuyot‎
         ו-‎galil‎. הוסר. במקומו ‎pwa-512.png‎, אותו סמל שה-PWA כבר מתקין. -->
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512.png" />

    <meta property="og:type" content="website" />
    <!-- כרטיס השיתוף (§6). מה שישב כאן היה צילום מסך של **סביבת התצוגה
         המקדימה של Lovable**, ‎id-preview-…lovable.app-1773074843204.png‎
         מ-09/03/2026, על דלי ‎r2.dev‎ שאינו שלנו: אי אפשר להחליף אותו,
         אי אפשר לרענן אותו, והוא נעלם ביום שהפרויקט שם יימחק. זו חתימת
         "נוצר בבנאי" על המשטח היחיד שנשלח בוואטסאפ. במקומו נכנס נכס אמיתי
         של האתר עצמו — ‎pwa-512.png‎, אותו סמל שה-PWA כבר מתקין. הוא ריבועי
         ולא 1.91:1, ולכן ‎twitter:card‎ ירד ל-‎summary‎ שזה בדיוק היחס שלו. -->
    <meta property="og:image" content="https://more30.com/galil/pwa-512.png">
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://more30.com/galil/pwa-512.png">
    <meta property="og:title" content="מחוברים — בתי כנסת חצור הגלילית">
    <meta name="twitter:title" content="מחוברים — בתי כנסת חצור הגלילית">
    <meta property="og:description" content="מחוברים — איגוד בתי הכנסת בחצור הגלילית. זמני תפילות, שיעורים ופעילויות קהילתיות.">
    <meta name="twitter:description" content="מחוברים — איגוד בתי הכנסת בחצור הגלילית. זמני תפילות, שיעורים ופעילויות קהילתיות.">
