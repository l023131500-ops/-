    <meta name="description" content="מיצוי זכויות מכל הגופים הממשלתיים — ביטוח לאומי, דיור, מיסים, רווחה ועוד. בדקו אילו זכויות מגיעות לכם בחינם.">
    <meta name="keywords" content="מיצוי זכויות, ביטוח לאומי, מענקים, הטבות, זכויות אזרח, דיור, מיסים, רווחה, בקלות">
    <meta name="author" content="בקלות">
    <!-- 🚨 canonical ו-og:url הצביעו לדומיין המקורי של Lovable — כתובת
         שנטפרי חוסמת, ושמדליפה את הארכיטקטורה הפנימית (DESIGN_STANDARD §8).
         הם תוקנו פעם אחת **בעותק הפרוס בלבד**, ולכן כל ‎vite build‎ היה מחזיר
         את הבאג. עכשיו הם במקור. -->
    <link rel="canonical" href="https://more30.com/zchuyot" />

    <!-- 🚨 הלשונית לא הייתה ריקה — היא ציירה את הסמל של more30.com. בלי
         ‎rel="icon"‎ הדפדפן נופל אל ‎/favicon.ico‎ על ה-**origin**, ומערכת
         שיושבת תחת נתיב יורשת בכך את הסמל של הפורטל (נמדד על 24 המונטים,
         QA/platform/favicon-mounts-0810). הנתיב נכתב עם קידומת המונט ולא
         כ-‎/favicon.svg‎, כי נתיב מוחלט-לשורש נפתר מול ה-origin ולא מול המונט —
         זו בדיוק התקלה שחמישה מונטים אחרים סובלים ממנה **בזכות** הצהרה שיש
         להם. ‎public/favicon.ico‎ שלצידו הוא ברירת המחדל של Lovable (אותם
         20,373 בתים בדיוק כמו ב-15-egod ובשני פרויקטים בארכיון) ולכן אינו
         מוצהר. -->
    <link rel="icon" type="image/svg+xml" href="/zchuyot/favicon.svg" />

    <!-- ‎og:image‎ הצביע לצילום תצוגה מקדימה של Lovable שהתארח אצל ספק
         אחסון חיצוני — מארח שנטפרי חוסמת, ותמונה של הגרסה הישנה של האתר.
         הוחלף בתצלום שאנחנו מגישים בעצמנו מאותו דומיין. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="בקלות — מיצוי זכויות, מענקים והטבות">
    <meta property="og:description" content="מיצוי זכויות מכל הגופים הממשלתיים — ביטוח לאומי, דיור, מיסים, רווחה ועוד. הזכות שלך, האחריות שלנו.">
    <meta property="og:url" content="https://more30.com/zchuyot">
    <meta property="og:image" content="https://more30.com/zchuyot/og.jpg">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="בקלות — מיצוי זכויות, מענקים והטבות">
    <meta name="twitter:description" content="מיצוי זכויות מכל הגופים הממשלתיים — ביטוח לאומי, דיור, מיסים, רווחה ועוד. הזכות שלך, האחריות שלנו.">
    <meta name="twitter:image" content="https://more30.com/zchuyot/og.jpg">

    <!-- ערכה כהה מלאה קיימת ב-‎index.css‎ כ-‎.dark‎ — ומעולם לא נראתה, כי
         שום דבר לא הוסיף את המחלקה. כאן ולא ב-React: הסקריפט רץ לפני הציור
         הראשון, ולכן מי שמגיע מ-‎more30.com‎ הכהה אל ‎/zchuyot‎ אינו מקבל
         הבזק לבן בדרך — וזה בדיוק מה ש-DESIGN_STANDARD §3 בא למנוע.
         ‎colorScheme‎ נכתב יחד עם המחלקה כדי שגם פסי הגלילה ושדות הטופס
         יהיו כהים ולא ילבינו באמצע עמוד כהה. -->
    <script>
      (function () {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function apply(on) {
          document.documentElement.classList.toggle('dark', on);
          document.documentElement.style.colorScheme = on ? 'dark' : 'light';
        }
        apply(mq.matches);
        mq.addEventListener('change', function (e) { apply(e.matches); });
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- הגיליון יורד מנתיב הציור הראשון (היה ‎@import‎ חוסם בראש
         ‎index.css‎). נטפרי חוסמת כאן את ‎fonts.googleapis.com‎ לסירוגין,
         ובקשה חוסמת שנכשלת מעכבת את כל העמוד עד שהיא נופלת. -->
    <link
