<!doctype html>
<!--
  ⚠️ ‎class="dark"‎ קבוע, ולא לפי העדפת המערכת.

  הסטודיו כהה בעיצובו: ‎Home‎ צובע ‎bg-[#0B1220]‎ קשיח, וכל המסכים בנויים
  סביב הכהה. אבל ‎body‎ עצמו ירש ‎--background: 40 30% 97%‎ — קרם — כי אף אחד
  לא הוסיף את המחלקה ‎.dark‎, שקיימת ב-‎index.css‎ במלואה מהיום הראשון.
  התוצאה שנמדדה: הרקע האפקטיבי של העמוד היה ‎rgb(250,248,245)‎, כלומר
  **המשתמש ראה מסך קרם לכל אורך הטעינה — כמעט ארבע שניות — ואז הבזק לכהה.**

  זה לא "אין מצב כהה": זה מצב כהה שהיה כתוב ולא הופעל. כאן, על התג עצמו,
  הוא פעיל לפני הבייט הראשון של ה-CSS. DESIGN_STANDARD §3 סעיף 2:
  עמוד כהה מלכתחילה עובר, ובלבד שיצהיר על כך.
-->
<html lang="he" dir="rtl" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ ‎maximum-scale‎ / ‎user-scalable=no‎ הוסרו: הם מונעים מהמשתמש
         להגדיל את העמוד, וזה כשל נגישות לפי DESIGN_STANDARD §5 (תקן 5568).
         בעמוד עברי צפוף זו בדיוק היכולת שמי שמתקשה לקרוא זקוק לה. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>מודעות AI — יצירת מודעות מעוצבות לקהילה</title>
    <meta name="description" content="מערכת ליצירת מודעות אבל, שמחה וארגון בעיצוב גרפי מקצועי עם בינה מלאכותית — טקסט עברי מדויק ורקעים מרהיבים." />
    <link rel="icon" type="image/svg+xml" href="/studio/favicon.svg" />
    <!-- ‎canonical‎ ו-‎og:url‎ **לא היו בעמוד כלל** — נמדד ריק בשלושת המצבים.
         DESIGN_STANDARD §8 מחייב את שניהם, מצביעים ל-more30.com. -->
    <link rel="canonical" href="https://more30.com/studio" />
    <meta property="og:url" content="https://more30.com/studio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="מודעות AI — יצירת מודעות מעוצבות לקהילה" />
    <meta
      property="og:description"
      content="מערכת ליצירת מודעות אבל, שמחה וארגון בעיצוב גרפי מקצועי עם בינה מלאכותית — טקסט עברי מדויק ורקעים מרהיבים."
    />
    <meta name="theme-color" content="#0B1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- שני גיליונות הפונטים ירדו מנתיב הציור הראשון. הם נושאים כחמישים

         בקשות חוסמות הם עיכבו את הציור עד שכולן הגיעו. הבחירה בעורך
