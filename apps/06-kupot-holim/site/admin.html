<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול · בקלות קופות חולים</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:var(--bg)}
    .admin-topbar{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .admin-topbar .inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .admin-brand{display:flex;align-items:center;gap:10px;color:var(--primary)}
    .admin-brand svg{width:30px;height:30px}
    .admin-brand .t{font-family:var(--font-head);font-weight:900;font-size:20px;color:var(--text);line-height:1}
    .admin-brand .s{font-size:12px;color:var(--text-muted)}
    .admin-wrap{max-width:1200px;margin:0 auto;padding:24px}

    /* Login */
    .login-shell{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md,0 8px 24px rgba(0,0,0,.06));padding:36px 32px;width:100%;max-width:400px}
    .login-card h1{font-size:24px;margin:0 0 6px;text-align:center}
    .login-card .sub{color:var(--text-muted);text-align:center;margin:0 0 26px;font-size:14px}
    .login-card .field{margin-bottom:16px;display:flex;flex-direction:column;gap:6px}
    .login-card label{font-weight:600;font-size:14px}
    .login-card input{padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;background:#fff}
    .login-card input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
    .login-err{color:var(--leumit);font-size:14px;margin:0 0 14px;text-align:center;min-height:18px}
    .login-card .btn-primary{width:100%;justify-content:center;margin-top:4px}
    .login-lock{width:52px;height:52px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);border-radius:50%}

    /* Dashboard */
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
    .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:18px 20px}
    .kpi .n{font-family:var(--font-head);font-weight:900;font-size:32px;color:var(--text);line-height:1}
    .kpi .l{color:var(--text-muted);font-size:14px;margin-top:6px}
    .kpi.accent .n{color:var(--primary)}

    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .toolbar input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;background:#fff}
    .toolbar select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font-body);font-size:15px;background:#fff}
    .toolbar .btn{padding:10px 16px;font-size:15px}

    .storage-note{font-size:13px;color:var(--text-muted);margin-bottom:14px}
    .storage-note .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
    .dot.ok{background:var(--meuhedet)} .dot.local{background:var(--leumit)}

    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
    table.leads{width:100%;border-collapse:collapse;font-size:14px;min-width:900px}
    table.leads th,table.leads td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--border);vertical-align:top}
    table.leads th{background:var(--surface-alt);font-weight:700;color:var(--text);position:sticky;top:0;white-space:nowrap}
    table.leads tr:last-child td{border-bottom:none}
    table.leads tr:hover td{background:var(--primary-soft)}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
    .badge.info{background:#E1F2F3;color:#006E78}
    .badge.switch{background:#FDECDD;color:#B45309}
    .badge.new{background:#E7F0FF;color:#1D4ED8}
    .badge.done{background:#E4F5DB;color:#3F7A1B}
    .fund-tag{font-weight:700}
    .fund-tag.clalit{color:var(--clalit)} .fund-tag.maccabi{color:var(--maccabi)}
    .fund-tag.meuhedet{color:var(--meuhedet)} .fund-tag.leumit{color:var(--leumit)}
    .row-actions{display:flex;gap:6px;white-space:nowrap}
    .act-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-body)}
    .act-btn:hover{border-color:var(--primary);color:var(--primary)}
    .act-btn.del:hover{border-color:var(--leumit);color:var(--leumit)}
    .empty{padding:48px 24px;text-align:center;color:var(--text-muted)}
    .loading{padding:48px 24px;text-align:center;color:var(--text-muted)}
    @media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>

  <!-- LOGIN GATE -->
  <div id="loginView" class="login-shell">
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="login-lock" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1>כניסה לניהול</h1>
      <p class="sub">בקלות · קופות חולים — ניהול פניות</p>
      <div class="field">
        <label for="adminUser">שם משתמש</label>
        <input type="text" id="adminUser" inputmode="numeric" autocomplete="username" />
      </div>
      <div class="field">
        <label for="adminPass">סיסמה</label>
        <input type="password" id="adminPass" autocomplete="current-password" />
      </div>
      <p id="loginErr" class="login-err" role="alert"></p>
      <button type="submit" class="btn btn-primary">כניסה</button>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dashView" hidden>
    <div class="admin-topbar">
      <div class="inner">
        <div class="admin-brand">
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="16"/><path d="M20 12v16M12 20h16"/></svg>
          <div>
            <div class="t">בקלות · ניהול</div>
            <div class="s">פניות קופות חולים</div>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <a href="index.html" class="btn btn-ghost" style="padding:8px 14px;font-size:14px">לאתר</a>
          <button id="logoutBtn" class="btn btn-ghost" style="padding:8px 14px;font-size:14px">יציאה</button>
        </div>
      </div>
    </div>

    <div class="admin-wrap">
      <p id="storageNote" class="storage-note"></p>

      <div class="kpis">
        <div class="kpi accent"><div class="n" id="kTotal">0</div><div class="l">סה"כ פניות</div></div>
        <div class="kpi"><div class="n" id="kNew">0</div><div class="l">חדשות</div></div>
        <div class="kpi"><div class="n" id="kSwitch">0</div><div class="l">בקשות מעבר</div></div>
        <div class="kpi"><div class="n" id="kDone">0</div><div class="l">טופלו</div></div>
      </div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="חיפוש: שם, טלפון, מייל, נושא..." />
        <select id="filterType">
          <option value="">כל הסוגים</option>
          <option value="info">מידע מפורט</option>
          <option value="switch">מעבר קופה</option>
        </select>
        <select id="filterStatus">
          <option value="">כל הסטטוסים</option>
          <option value="new">חדשות</option>
          <option value="done">טופלו</option>
        </select>
        <button id="refreshBtn" class="btn btn-ghost">רענון</button>
        <button id="csvBtn" class="btn btn-ghost">ייצוא CSV</button>
        <button id="xlsBtn" class="btn btn-primary">ייצוא Excel</button>
      </div>

      <div class="table-wrap">
        <table class="leads" id="leadsTable">
          <thead>
            <tr>
              <th>תאריך</th><th>סוג</th><th>שם מלא</th><th>טלפון</th><th>מייל</th>
              <th>נושא</th><th>מעבר</th><th>כתובת</th><th>סטטוס</th><th>פעולות</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr><td colspan="10" class="loading">טוען פניות...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="leads-store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
