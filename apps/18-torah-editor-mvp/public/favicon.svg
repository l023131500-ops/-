    <path d="M0.1806 0.5463L0.1358 0.5582L0.1 0.5791L0.0627 0.6194L0.0448 0.6552L0.0269 0.7418L0.0269 0.9358L0.0209 0.9567L0 0.9806L0.0164 1L0.0701 0.994L0.1478 0.9612L0.191 0.9239L0.209 0.891L0.2209 0.8403L0.2209 0.6612L0.2358 0.6134L0.2716 0.5836L0.2716 0.5567L0.2403 0.5463Z"/>
  </g>
</svg>
