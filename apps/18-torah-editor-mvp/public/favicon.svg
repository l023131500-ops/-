<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="העורך התורני">
  <!--
    הסמל של orech (18-torah-editor-mvp).

    למערכת הזו אין סימן גרפי כלל: אין <svg> אחד בכל app/, אין רכיב Header,
    ואין נווט. הזהות שלה טיפוגרפית לחלוטין — ‎app/page.tsx‎ מצייר ‎<h1>‎ אחת,
    "העורך התורני", ב-‎28px/700‎ על נייר חם. לכן הסמל הוא האות הראשונה של
    הכיתוב שהעמוד באמת מצייר, כמו ב-zchuyot.

    כל ערך כאן נמדד ב-more30.com/orech בדפדפן אמיתי לפני שנכתב הקובץ:

      האריח   rgb(122, 92, 46)   = getComputedStyle(button.action).backgroundColor
      הגליף   rgb(255, 255, 255) = getComputedStyle(button.action).color
      הרדיוס  8px על כפתור 37px  = 0.216, כלומר 10.4 בתיבה בת 48

    הזוג אינו מורכב: ‎button.action‎ הוא הטוקן ‎accent‎ ברקע עם הטוקן ‎surface‎
    בטקסט, כלומר לבן-על-חום הוא זוג חי בעמוד עצמו ולא צירוף שנבחר כאן.
    ניגודיותו 6.17:1 — מעל המינימום, ולכן לא הוחלף שום טוקן.
    ‏(שמות הטוקנים נכתבו כאן בלי התחילית ‎var()‎ שלהם בכוונה: שני מקפים רצופים
    אסורים בתוך הערת XML, וגרסה קודמת של הקובץ הזה הוגשה 200 באורך הנכון
    ולא צוירה כלל בגללם.)

    ── מה שנמדד ולא הונח: הגופן ──────────────────────────────────────────────

    ‎globals.css‎ מבקש ‎'Frank Ruhl Libre', 'David Libre', 'Noto Serif Hebrew',
    serif‎ — אבל האפליקציה אינה טוענת אף אחד מהם: אין ‎next/font‎, אין ‎@font-face‎
    ‏(‎[...document.fonts]‎ ריק בייצור), ואין ‎<link>‎ לגופן. ‎document.fonts.check‎
    מחזיר ‎true‎ לשלושתם, וזו מלכודת ידועה — הוא עונה על הנפילה-לאחור ולא על
    זמינות. הבדיקה שכן מכריעה היא רוחב: ‎measureText('העורך התורני')‎ יצא
    ‎137.4297px‎ **זהה בדיוק** לארבעתם, כולל ‎serif‎ הגנרי. כלומר אף אחד משלושת
    השמות אינו נפתר לגופן נפרד, והכיתוב מצויר ב-serif של המערכת.

    לכן, בשונה מ-chizukim (ששם ‎Frank Ruhl Libre‎ אכן נטען והאות נמדדה ממנו),
    האות כאן נמדדה **מהמראה בפועל** — אותו מחרוזת ‎font-family‎ מלאה, אותו
    משקל 700, כפי ש-‎getComputedStyle‎ מחזיר אותה מהעמוד החי.

    ── איך נוצר הנתיב ────────────────────────────────────────────────────────

    לא צויר ביד. האות רונדרה ל-canvas ב-600px, הרסטר עבר בינאריזציה בסף 128,
    ‏marching squares הוציא את קווי המתאר, ו-RDP פישט אותם בסבילות 1.8px:

      שני מתארים, 1304 ו-488 נקודות גולמיות → 33 ו-20
      תיבת דיו 271 × 335, יחס 0.809

    שני המתארים הם שני הפסים המנותקים של ה׳ — גג+רגל-ימנית כגוף אחד, ורגל
    שמאלית נפרדת. אין חורים, ולכן ‎fill-rule‎ אינו משנה. הקואורדינטות למטה הן
    התוצר המפושט כמות שהוא, מנורמל לגובה הדיו; ‎scale(32)‎ הוא כל מה שנוסף.

    שתי סטיות, שתיהן מוצהרות:

    1. הגליף הוגדל ביחס לאריח, כמו ב-chizukim. אין כאן אריח חי להשוות אליו —
       יש כותרת על נייר — ולכן הגובה נבחר: 32 מתוך 48 (67%), כמו במערכת
       האחות. זה הערך היחיד בקובץ שאינו מדוד.
    2. הסבילות של 1.8px ב-600 מעגלת את קימורי הסריפים. ב-16px היחידה הזו
       היא 0.048px.

    ולבסוף מה שנמדד על הציור עצמו ב-16px, כי שם ה׳ יכולה להתמוטט לכתם אחד.
    הרסטר נסרק שורה-שורה:

      גג            שורות 3–6, ברוחב 8 פיקסלים (7 בשורה האחרונה)
      מרווח         שורה 7 בלבד, ובה x6–x8 הם ‎rgb(122,92,46)‎ נקי
      רגל שמאלית    שורות 8–12, רוחב 2
      רגל ימנית     שורות 7–12, רוחב 1–2

    כלומר שלושת המרכיבים של ה׳ — גג, רגל מחוברת ורגל מנותקת — נשארים שלושה
    ולא נמרחים לגוש. בשונה מ-chizukim, שם אף פיקסל של רגל לא הגיע ללבן מלא,
    כאן שלושתם מגיעים: השיא בכל אחד מהאזורים הוא ‎255,255,255‎ מדויק, ולכן
    ‏6.18:1 מול האריח.

    האריח כהה, ולכן נבדק גם ההפך: מול סרגל לשוניות כהה (‎#202124‎) האריח עצמו
    כמעט אינו נבדל מהרקע (2.60:1), אבל האות לבנה — ומה שנקרא הוא האות. מול
    סרגל בהיר (‎#F1F3F4‎) האריח הוא שנושא את הזיהוי (5.55:1). בשני המקרים
    משהו נראה.
  -->
  <rect width="48" height="48" rx="10.4" fill="#7A5C2E"/>
