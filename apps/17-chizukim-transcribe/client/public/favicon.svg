<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="חיזוקים קצרים">
  <!--
    הסמל של chizukim (17-chizukim-transcribe).

    בשונה מ-imud ומ-egod, למערכת הזו אין SVG חי להעתיק ממנו: אין ולו <svg> אחד
    בכל client/src, ואין רכיב Header כלל. הסימן שלה טיפוגרפי — האריח שב-
    recordings.tsx מצייר בראש כל עמוד: `w-10 h-10 rounded-lg bg-primary
    text-primary-foreground ... font-serif text-xl font-bold` ובתוכו האות ח.

    כל ערך כאן נמדד ב-more30.com/chizukim בדפדפן אמיתי לפני שנכתב הקובץ, ואף
    אחד מהם לא נבחר:

      האריח    rgb(46, 70, 127)   = getComputedStyle(tile).backgroundColor
      הגליף    rgb(252, 250, 248) = getComputedStyle(tile).color
      הרדיוס   9px על אריח 40px   = 0.225, כלומר 10.8 בתיבה בת 48
                                    (ב-imud הרדיוס נבחר; כאן הוא נמדד)

    ניגודיות הזוג החי היא 8.8:1, הרבה מעל המינימום 3:1 לגרפיקה — ולכן, כמו
    ב-imud ובשונה מ-egod, לא הוחלף כאן שום זוג טוקנים.

    צורת האות. גופן אינו זמין לסמל לשונית, ולכן ח חייבת להיות נתיב. במקום
    לצייר אותה מהראש, "Frank Ruhl Libre" 700 (אותו גופן שהאריח החי מבקש,
    document.fonts.check עבר) צויר ל-canvas ב-200px ונסרק פיקסל-פיקסל; אלה
    המידות שיצאו, בקואורדינטות מקומיות של תיבת הדיו (84 רוחב × 119 גובה):

      הגג          y 9–41 (עובי 32), x 2–84
      דגלון שמאלי  מתנשא עד y 0, x 6–9 בקודקוד ומתרחב ל-3–12 בבסיס
      רגל שמאלית   רוחב ~12.5, אמצע ב-x 5–16
      רגל ימנית    רוחב ~12.5, אמצע ב-x 68–79

    ארבע סטיות מהחי, כולן בגלל 16px, וכולן מוצהרות:

    1. הגליף הוגדל ביחס לאריח. בחי הוא 20px בתוך אריח 40px, כלומר תיבת הדיו
       תופסת 21% מרוחב האריח; ב-16px זה 3.4px ולא היה נקרא כלל. כאן הוא 32
       מתוך 48 לגובה (67%).
    2. שיפוע הרגליים בוטל. הן יוצאות מהגג ב-x 14–21 ו-73–80 ונודדות שמאלה
       ל-5–16 ו-68–79 — 9 יחידות, שהן 0.75px ב-16px. הן צוירו אנכיות.
    3. מודולציית העובי בוטלה. הרגל דקה (~8) מתחת לגג ומתעבה (~12.5) באמצע;
       ההפרש הוא 0.17px ב-16px.
    4. הטפרים בבסיס הרגליים (x 130 y 286–289 בסריקה, וההצרה בשורה האחרונה)
       הושמטו מאותה סיבה.

    האריח כהה, ולכן הבדיקה ההפוכה נעשתה גם היא: על סרגל לשוניות כהה האריח
    עצמו כמעט לא נבדל מהרקע (1.8:1), אבל האות בהירה — ומה שנקרא הוא האות.
    על סרגל בהיר האריח הוא שנושא את הזיהוי. בשני המקרים משהו נראה.

    ולבסוף מה שנמדד על הציור עצמו ב-16px, כי כאן הסטייה הראשונה נגמרת: הרגל
    יוצאת 1.12px, כלומר היא לא יכולה לנחות על גבול פיקסל. הגג מגיע ללבן מלא
    (1.00 בשתי שורות), אבל אף פיקסל של רגל אינו מגיע — השיא הוא 0.80 בעמודה
    אחת ו-0.67 בשנייה. זה נבדק ולא הוסק: גם עמודה של 0.67 היא rgb(184,191,208)
    מול אריח rgb(46,70,127), כלומר 4.9:1 — מעל 3:1, ולכן הרגליים נקראות.
    הגיאומטריה לא עובתה מעבר למדוד, כי המדידה כבר עוברת את הסף.
  -->
  <rect width="48" height="48" rx="10.8" fill="#2E467F"/>
  <g transform="translate(12.7 8) scale(0.26891)" fill="#FCFAF8">
    <path d="M2 9H84V41H2Z"/>
    <path d="M4 9L6.5 0H10L12 9Z"/>
    <path d="M5 41H17.5V119H5Z"/>
    <path d="M68 41H80.5V119H68Z"/>
  </g>
</svg>
