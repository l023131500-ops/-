<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- מצב כהה (DESIGN_STANDARD §3). טוקני ‎.dark‎ נוספו ב-‎src/index.css‎;
         השורות האלה הן מי שמדליק אותם. הן יושבות בתוך ה-‎<head>‎ ורצות לפני
         הציור הראשון, ולכן אין הבזק לבן — בניגוד להחלה מתוך React, שרצה רק
         אחרי שהעמוד כבר צויר בהיר. -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function (dark) {
          document.documentElement.classList.toggle("dark", dark);
        };
        apply(mq.matches);
        mq.addEventListener
          ? mq.addEventListener("change", function (e) { apply(e.matches); })
          : mq.addListener(function (e) { apply(e.matches); });
      })();
    </script>
    <title>איגוד השיעורים — פורטל מגידי השיעורים</title>
    <meta name="description" content="דף לכל שיעור עם נושא, זמנים ומיקום, ניהול משתתפים וחומרי עזר — למגידי שיעורים.">
    <meta name="author" content="איגוד השיעורים" />

    <meta property="og:type" content="website" />
    <!-- כרטיס השיתוף (§6). ישב כאן צילום מסך של **סביבת התצוגה המקדימה של
         Lovable**, ‎id-preview-…lovable.app-1777595828138.png‎ מ-01/05/2026,
         על דלי ‎r2.dev‎ שאינו שלנו. הוסר ולא הוחלף: בניגוד ל-‎galil‎
         ול-‎mthbram‎, ל-‎egod‎ **אין שום תמונה משלה** — ‎public/‎ מחזיקה
         ‎favicon.ico‎ (ברירת המחדל של הבנאי, אותו SHA256 בארבע מערכות)
         ו-‎placeholder.svg‎ בלבד. הצבעה על אחת מהן הייתה מחליפה חתימת-בנאי
         בחתימת-בנאי. בלי ‎og:image‎ הקישור מוצג ככותרת ותיאור — אלה נכונים.
         צריך נכס אמיתי; נרשם ב-NEEDS_USER. -->
    <meta property="og:title" content="איגוד השיעורים — פורטל מגידי השיעורים">
    <meta name="twitter:title" content="איגוד השיעורים — פורטל מגידי השיעורים">
    <meta property="og:description" content="דף לכל שיעור עם נושא, זמנים ומיקום, ניהול משתתפים וחומרי עזר — למגידי שיעורים.">
    <meta name="twitter:description" content="דף לכל שיעור עם נושא, זמנים ומיקום, ניהול משתתפים וחומרי עזר — למגידי שיעורים.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
      <!-- כפתור הכניסה המשותף של more30 (חייב לשבת במקור, לא רק בעותק הפרוס) -->
    <script src="https://more30.com/auth-button.js" defer></script>
  </body>
</html>
